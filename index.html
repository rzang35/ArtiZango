<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ArtiZango — Abidjan</title>
<meta name="theme-color" content="#1D9E75">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;
  --amber:#BA7517;--blue:#185FA5;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;
  --bg:#f5f5f3;--surface:#fff;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --r:12px;--r2:8px;--wa:#25D366
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow:hidden}
.view.active{transform:translateX(0)}
.view.slide-left{transform:translateX(-30%)}
.topbar{background:var(--surface);border-bottom:.5px solid var(--border);padding:12px 16px 10px;flex-shrink:0}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-size:20px;font-weight:700;color:var(--green);letter-spacing:-.5px}
.loc-badge{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--green-dark);background:var(--green-light);padding:5px 10px;border-radius:20px;max-width:165px}
.loc-badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;height:38px;padding:0 12px;border:.5px solid var(--border2);border-radius:var(--r2);background:var(--bg);font-size:14px;color:var(--text);outline:none;font-family:inherit}
.search-row input:focus{border-color:var(--green)}
.search-row select{height:38px;padding:0 8px;border:.5px solid var(--border2);border-radius:var(--r2);background:var(--bg);font-size:13px;color:var(--text);outline:none;font-family:inherit}
.filter-row{display:flex;gap:6px;padding:10px 16px 6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--surface);border-bottom:.5px solid var(--border)}
.filter-row::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 12px;border-radius:20px;border:.5px solid var(--border2);color:var(--text2);background:var(--surface);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
.chip.active{background:var(--green-light);border-color:var(--green);color:var(--green-dark);font-weight:500}
.results-header{padding:10px 16px 4px;font-size:12px;color:var(--text3);flex-shrink:0}
.results-list{flex:1;overflow-y:auto;padding:8px 16px 80px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}
.map-hidden{display:none}
.artisan-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.artisan-card:active{opacity:.85}
.card-top{display:flex;gap:12px;align-items:flex-start}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600}
.card-metier{font-size:12px;color:var(--text2);margin-top:2px}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.stars{color:var(--amber);font-size:13px}
.star-count{font-size:11px;color:var(--text3);margin-left:2px}
.dist-badge{font-size:11px;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:10px}
.dispo-on{font-size:11px;color:var(--green)}
.dispo-off{font-size:11px;color:var(--text3)}
.card-desc{font-size:13px;color:var(--text2);margin-top:9px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 8px;border-radius:10px;background:var(--bg);color:var(--text2);border:.5px solid var(--border)}
.card-actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:.5px solid var(--border)}
.btn-green{flex:1;height:36px;border-radius:var(--r2);border:none;background:var(--green);color:#fff;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn-green:hover{background:var(--green-dark)}
.btn-outline{height:36px;padding:0 14px;border-radius:var(--r2);border:.5px solid var(--border2);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.empty-state{text-align:center;padding:48px 24px;color:var(--text2)}
.hidden{display:none!important}
.bottom-nav{height:56px;border-top:.5px solid var(--border);display:flex;background:var(--surface);flex-shrink:0;position:absolute;bottom:0;left:0;right:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;transition:color .15s}
.nav-btn.active{color:var(--green)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.detail-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:.5px solid var(--border);flex-shrink:0}
.back-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:26px;line-height:1;padding:2px 6px;border-radius:8px}
.detail-title{font-size:16px;font-weight:500}
.detail-body{flex:1;overflow-y:auto;padding:20px 16px 40px;-webkit-overflow-scrolling:touch}
.detail-avatar{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;margin-bottom:14px}
.detail-name{font-size:20px;font-weight:600}
.detail-sub{font-size:13px;color:var(--text2);margin-top:3px}
.detail-stars{display:flex;align-items:center;gap:4px;margin-top:10px;color:var(--amber);font-size:15px}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px}
.contact-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:var(--r2);margin-bottom:8px;font-size:14px}
.copy-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px}
.btn-wa{width:100%;height:46px;border-radius:var(--r2);border:none;background:var(--wa);color:#fff;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-family:inherit}
.btn-call{width:100%;height:46px;border-radius:var(--r2);border:.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-family:inherit}
.review-card{background:var(--bg);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px}
.review-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.review-av{width:28px;height:28px;border-radius:50%;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.review-author{font-size:13px;font-weight:500}
.review-date{font-size:11px;color:var(--text3);margin-left:auto}
.review-text{font-size:13px;color:var(--text2);line-height:1.5}
.register-intro{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px;padding:14px;background:var(--green-light);border-radius:var(--r2);border-left:3px solid var(--green)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:.5px solid var(--border2);border-radius:var(--r2);background:var(--bg);font-size:14px;color:var(--text);outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green);background:var(--surface)}
.form-group textarea{resize:vertical}
.btn-submit{width:100%;height:48px;border-radius:var(--r2);border:none;background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:8px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
/* Leaflet popup custom */
.popup-card{min-width:180px}
.popup-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.popup-metier{font-size:12px;color:var(--text2)}
.popup-meta{display:flex;align-items:center;gap:6px;margin:6px 0}
.popup-btn{width:100%;height:32px;border-radius:6px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px}
/* user location pulse */
.pulse-marker{width:16px;height:16px;border-radius:50%;background:#185FA5;border:3px solid #fff;box-shadow:0 0 0 4px rgba(24,95,165,.3)}
@media(min-width:480px){
  body{background:#e5e5e3;display:flex;align-items:center;justify-content:center}
  .view{max-width:420px;width:100%;border-radius:28px;border:.5px solid rgba(0,0,0,.12);overflow:hidden;height:85vh;max-height:780px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) translateX(100vw);box-shadow:0 8px 40px rgba(0,0,0,.12)}
  .view.active{transform:translate(-50%,-50%) translateX(0)}
  .view.slide-left{transform:translate(-50%,-50%) translateX(-30%)}
}
</style>
</head>
<body>

<!-- VUE PRINCIPALE -->
<div id="viewMain" class="view active">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">ArtiZango</div>
      <div class="loc-badge">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span id="locLabel">Localisation…</span>
      </div>
    </div>
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="Menuisier, plombier…" oninput="app.filter()" autocomplete="off">
      <select id="metierFilter" onchange="app.filter()">
        <option value="">Tous</option>
        <option>Menuisier</option><option>Électricien</option><option>Plombier</option>
        <option>Peintre</option><option>Maçon</option><option>Carreleur</option>
        <option>Serrurier</option><option>Climatisation</option>
      </select>
    </div>
  </div>

  <div class="filter-row">
    <button class="chip active" data-radius="2" onclick="app.setRadius(this)">◎ &lt; 2 km</button>
    <button class="chip" data-radius="5" onclick="app.setRadius(this)">◎ &lt; 5 km</button>
    <button class="chip" data-radius="10" onclick="app.setRadius(this)">◎ &lt; 10 km</button>
    <button class="chip" id="chipDispo" onclick="app.toggleDispo(this)">⏱ Disponible</button>
    <button class="chip" id="chipTop" onclick="app.toggleTop(this)">★ Mieux notés</button>
  </div>

  <div class="results-header" id="resultsHeader">Recherche en cours…</div>

  <!-- LISTE -->
  <div id="resultsList" class="results-list"></div>
  <div id="emptyState" class="empty-state hidden">
    <div style="font-size:40px;margin-bottom:12px">🔍</div>
    <p>Aucun artisan dans cette zone.</p>
    <p style="font-size:13px;color:var(--text3);margin-top:4px">Essayez d'élargir le rayon.</p>
  </div>

  <!-- CARTE -->
  <div id="mapWrap" class="map-wrap map-hidden">
    <div id="map"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="navListe" onclick="app.showListe()">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Liste</span>
    </button>
    <button class="nav-btn" id="navCarte" onclick="app.showCarte()">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Carte</span>
    </button>
    <button class="nav-btn" onclick="app.showRegister()">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>S'inscrire</span>
    </button>
    <button class="nav-btn" onclick="app.showAbout()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>À propos</span>
    </button>
  </nav>
</div>

<!-- VUE PROFIL -->
<div id="viewDetail" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="app.goBack()">‹</button>
    <span class="detail-title">Profil artisan</span>
  </div>
  <div id="detailBody" class="detail-body"></div>
</div>

<!-- VUE INSCRIPTION -->
<div id="viewRegister" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="app.goBack()">‹</button>
    <span class="detail-title">Inscription artisan</span>
  </div>
  <div class="detail-body">
    <p class="register-intro">Vous êtes artisan à Abidjan ? Créez votre profil gratuitement et soyez visible par vos clients.</p>
    <form id="registerForm" onsubmit="app.submitRegister(event)">
      <div class="form-group"><label>Nom complet *</label><input type="text" name="nom" required placeholder="Ex: Konan Brou"></div>
      <div class="form-group"><label>Corps de métier *</label>
        <select name="metier" required><option value="">Choisir…</option>
          <option>Menuisier</option><option>Électricien</option><option>Plombier</option>
          <option>Peintre</option><option>Maçon</option><option>Carreleur</option>
          <option>Serrurier</option><option>Climatisation</option>
        </select>
      </div>
      <div class="form-group"><label>Téléphone / WhatsApp *</label><input type="tel" name="tel" required placeholder="+225 07 XX XX XX"></div>
      <div class="form-group"><label>Années d'expérience *</label><input type="number" name="experience" required min="1" max="50" placeholder="Ex: 8"></div>
      <div class="form-group"><label>Quartier de travail *</label><input type="text" name="zone" required placeholder="Ex: Cocody Angré"></div>
      <div class="form-group"><label>Description *</label><textarea name="description" required rows="3" placeholder="Décrivez votre activité…"></textarea></div>
      <div class="form-group"><label>Spécialités (séparées par virgules)</label><input type="text" name="tags" placeholder="Ex: Portes, Fenêtres, Placards"></div>
      <button type="submit" class="btn-submit">✓ Créer mon profil gratuitement</button>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ARTISANS=[
  {id:1,nom:"Konan Brou",metier:"Menuisier",note:4.8,avis:23,lat:5.3678,lng:-3.9756,dispo:true,exp:"8 ans",av:"KB",bg:"#E6F1FB",cl:"#0C447C",desc:"Spécialiste portes, fenêtres, placards sur mesure. Devis gratuit.",tags:["Portes","Fenêtres","Placards","Parquet"],tel:"+225 07 58 32 10",wa:"22507583210",zone:"Cocody Angré",reviews:[{a:"Aya K.",n:5,d:"Jan 2025",t:"Très professionnel, a terminé en avance !"},{a:"Marcel D.",n:5,d:"Déc 2024",t:"Travail impeccable. Prix raisonnable."},{a:"Fatoumata S.",n:4,d:"Nov 2024",t:"Bon artisan, résultat top."}]},
  {id:2,nom:"Diallo Mamadou",metier:"Électricien",note:4.6,avis:41,lat:5.3721,lng:-3.9801,dispo:true,exp:"12 ans",av:"DM",bg:"#FAEEDA",cl:"#633806",desc:"Installations électriques, dépannage, tableaux. Agréé SOGEPE.",tags:["Installation","Dépannage","Tableau","Clim"],tel:"+225 05 44 71 88",wa:"22505447188",zone:"2 Plateaux",reviews:[{a:"Ibrahim T.",n:5,d:"Fév 2025",t:"Intervention en moins de 2h."},{a:"Corinne A.",n:4,d:"Jan 2025",t:"Bon travail, tarif honnête."}]},
  {id:3,nom:"Yao Fernand",metier:"Plombier",note:4.3,avis:17,lat:5.3645,lng:-3.9712,dispo:false,exp:"5 ans",av:"YF",bg:"#E1F5EE",cl:"#085041",desc:"Plomberie générale, fuites, installations sanitaires.",tags:["Fuites","Sanitaires","Robinetterie","Chauffe-eau"],tel:"+225 01 23 56 78",wa:"22501235678",zone:"Riviera 3",reviews:[{a:"Sophie N.",n:4,d:"Jan 2025",t:"Rapide et propre."},{a:"Amed B.",n:5,d:"Nov 2024",t:"Parfait, rien à dire."}]},
  {id:4,nom:"Ouédraogo Jean",metier:"Peintre",note:4.9,avis:8,lat:5.3699,lng:-3.9778,dispo:true,exp:"10 ans",av:"OJ",bg:"#FBEAF0",cl:"#72243E",desc:"Peinture intérieure et extérieure. Enduit, ravalement, décoration.",tags:["Intérieur","Extérieur","Enduit","Déco"],tel:"+225 07 11 90 34",wa:"22507119034",zone:"Blockauss",reviews:[{a:"Patrick L.",n:5,d:"Fév 2025",t:"Appartement méconnaissable !"},{a:"Mariama D.",n:5,d:"Jan 2025",t:"Minutieux, à l'heure."}]},
  {id:5,nom:"Traoré Issouf",metier:"Maçon",note:4.1,avis:12,lat:5.3590,lng:-3.9650,dispo:true,exp:"15 ans",av:"TI",bg:"#F1EFE8",cl:"#444441",desc:"Gros œuvre, rénovation, carrelage, terrasse.",tags:["Gros œuvre","Carrelage","Terrasse","Rénovation"],tel:"+225 05 67 23 41",wa:"22505672341",zone:"Riviera Golf",reviews:[{a:"Hervé K.",n:4,d:"Déc 2024",t:"Bonne qualité, respecte les délais."}]},
  {id:6,nom:"Assi Germaine",metier:"Carreleur",note:4.7,avis:19,lat:5.3710,lng:-3.9820,dispo:true,exp:"7 ans",av:"AG",bg:"#EAF3DE",cl:"#27500A",desc:"Pose carrelage sol et mur, faïence, mosaïque.",tags:["Sol","Mur","Faïence","Mosaïque"],tel:"+225 07 34 55 90",wa:"22507345590",zone:"Danga",reviews:[{a:"Alexis M.",n:5,d:"Jan 2025",t:"Salle de bain magnifique."},{a:"Binta S.",n:5,d:"Déc 2024",t:"Professionnelle et ponctuelle."}]}
];

const COLORS={Menuisier:"#0C447C",Électricien:"#633806",Plombier:"#085041",Peintre:"#72243E",Maçon:"#444441",Carreleur:"#27500A",Serrurier:"#3B1A6B",Climatisation:"#185FA5"};

const app=(()=>{
  let S={lat:5.3701,lng:-3.9789,radius:2,dispo:false,top:false,view:'viewMain',history:[],list:[...ARTISANS],mode:'liste',map:null,userMarker:null,artisanMarkers:[],filtered:[]};

  function init(){geo();filter()}

  function geo(){
    const el=document.getElementById('locLabel');
    if(!navigator.geolocation){el.textContent='Cocody, Abidjan';filter();return}
    navigator.geolocation.getCurrentPosition(pos=>{
      S.lat=pos.coords.latitude;S.lng=pos.coords.longitude;
      el.textContent='Position détectée';
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${S.lat}&lon=${S.lng}&format=json&accept-language=fr`)
        .then(r=>r.json()).then(d=>{
          const q=d.address;
          el.textContent=q.suburb||q.neighbourhood||q.city_district||q.city||'Abidjan';
        }).catch(()=>{});
      filter();
      if(S.map) updateMapUser();
    },()=>{el.textContent='Cocody, Abidjan';filter()},{timeout:8000});
  }

  function dist(a){
    const R=6371,dLat=(a.lat-S.lat)*Math.PI/180,dLng=(a.lng-S.lng)*Math.PI/180;
    const x=Math.sin(dLat/2)**2+Math.cos(S.lat*Math.PI/180)*Math.cos(a.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  }

  function stars(n){
    let s='';
    for(let i=1;i<=5;i++) s+=i<=Math.floor(n)?'★':(i-n<1&&n%1>=.5?'½':'<span style="opacity:.25">★</span>');
    return s;
  }

  function filter(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const m=document.getElementById('metierFilter').value;
    let list=S.list.map(a=>({...a,d:dist(a)})).filter(a=>{
      if(a.d>S.radius)return false;
      if(S.dispo&&!a.dispo)return false;
      if(m&&a.metier!==m)return false;
      if(q&&!`${a.nom} ${a.metier} ${(a.tags||[]).join(' ')} ${a.desc}`.toLowerCase().includes(q))return false;
      return true;
    });
    if(S.top)list.sort((a,b)=>b.note-a.note);else list.sort((a,b)=>a.d-b.d);
    S.filtered=list;
    if(S.mode==='liste') renderListe(list);
    else updateMapMarkers(list);
  }

  function renderListe(list){
    const el=document.getElementById('resultsList');
    const empty=document.getElementById('emptyState');
    document.getElementById('resultsHeader').textContent=`${list.length} artisan${list.length>1?'s':''} · rayon ${S.radius} km`;
    if(!list.length){el.innerHTML='';empty.classList.remove('hidden');return}
    empty.classList.add('hidden');
    el.innerHTML=list.map(a=>`
      <div class="artisan-card" onclick="app.openDetail(${a.id})">
        <div class="card-top">
          <div class="avatar" style="background:${a.bg};color:${a.cl}">${a.av}</div>
          <div class="card-info">
            <div class="card-name">${a.nom}</div>
            <div class="card-metier">${a.metier} · ${a.exp} d'exp.</div>
            <div class="card-meta">
              <span class="stars">${stars(a.note)}<span class="star-count">${a.note} (${a.avis})</span></span>
              <span class="dist-badge">📍 ${a.d.toFixed(1)} km</span>
              <span class="${a.dispo?'dispo-on':'dispo-off'}">${a.dispo?'● Disponible':'○ Occupé'}</span>
            </div>
          </div>
        </div>
        <div class="card-desc">${a.desc}</div>
        <div class="card-tags">${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="card-actions">
          <button class="btn-green" onclick="event.stopPropagation();app.openDetail(${a.id})">👤 Voir le profil</button>
          <button class="btn-outline" onclick="event.stopPropagation();app.call('${a.tel}')">📞 Appeler</button>
        </div>
      </div>`).join('');
  }

  /* ── CARTE ── */
  function initMap(){
    if(S.map)return;
    S.map=L.map('map',{zoomControl:true}).setView([S.lat,S.lng],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© OpenStreetMap',maxZoom:19
    }).addTo(S.map);
    updateMapUser();
    updateMapMarkers(S.filtered);
    setTimeout(()=>S.map.invalidateSize(),300);
  }

  function updateMapUser(){
    if(!S.map)return;
    const icon=L.divIcon({className:'',html:'<div class="pulse-marker"></div>',iconSize:[16,16],iconAnchor:[8,8]});
    if(S.userMarker)S.userMarker.setLatLng([S.lat,S.lng]);
    else S.userMarker=L.marker([S.lat,S.lng],{icon,zIndexOffset:1000}).addTo(S.map).bindPopup('<b>Vous êtes ici</b>');
    S.map.setView([S.lat,S.lng],14);
  }

  function updateMapMarkers(list){
    if(!S.map)return;
    S.artisanMarkers.forEach(m=>S.map.removeLayer(m));
    S.artisanMarkers=[];
    list.forEach(a=>{
      const color=COLORS[a.metier]||'#1D9E75';
      const icon=L.divIcon({
        className:'',
        html:`<div style="background:${color};color:#fff;border-radius:50% 50% 50% 0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(-45deg)"><span style="transform:rotate(45deg)">${a.av}</span></div>`,
        iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-34]
      });
      const popup=`<div class="popup-card">
        <div class="popup-name">${a.nom}</div>
        <div class="popup-metier">${a.metier} · ${a.exp}</div>
        <div class="popup-meta"><span style="color:#BA7517">${stars(a.note)}</span><span style="font-size:11px;color:#9a9a9a;margin-left:4px">${a.note} (${a.avis})</span><span style="font-size:11px;margin-left:auto;color:#6b6b6b">📍${a.d.toFixed(1)}km</span></div>
        <span style="font-size:11px;color:${a.dispo?'#1D9E75':'#9a9a9a'}">${a.dispo?'● Disponible':'○ Occupé'}</span>
        <button class="popup-btn" onclick="app.openDetail(${a.id})">Voir le profil →</button>
      </div>`;
      const marker=L.marker([a.lat,a.lng],{icon}).addTo(S.map).bindPopup(popup,{maxWidth:220});
      S.artisanMarkers.push(marker);
    });
    document.getElementById('resultsHeader').textContent=`${list.length} artisan${list.length>1?'s':''} · rayon ${S.radius} km`;
  }

  function showListe(){
    S.mode='liste';
    document.getElementById('resultsList').classList.remove('hidden');
    document.getElementById('emptyState');
    document.getElementById('mapWrap').classList.add('map-hidden');
    document.getElementById('navListe').classList.add('active');
    document.getElementById('navCarte').classList.remove('active');
    renderListe(S.filtered);
  }

  function showCarte(){
    S.mode='carte';
    document.getElementById('resultsList').classList.add('hidden');
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('mapWrap').classList.remove('map-hidden');
    document.getElementById('navListe').classList.remove('active');
    document.getElementById('navCarte').classList.add('active');
    initMap();
    updateMapMarkers(S.filtered);
    setTimeout(()=>{if(S.map)S.map.invalidateSize()},350);
  }

  function setRadius(el){
    document.querySelectorAll('.chip[data-radius]').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');S.radius=parseFloat(el.dataset.radius);filter();
  }
  function toggleDispo(el){S.dispo=!S.dispo;el.classList.toggle('active',S.dispo);filter()}
  function toggleTop(el){S.top=!S.top;el.classList.toggle('active',S.top);filter()}

  function openDetail(id){
    const a=S.list.find(x=>x.id===id);if(!a)return;
    const d=dist(a);
    document.getElementById('detailBody').innerHTML=`
      <div class="detail-avatar" style="background:${a.bg};color:${a.cl}">${a.av}</div>
      <div class="detail-name">${a.nom}</div>
      <div class="detail-sub">${a.metier} · ${a.exp} · Cocody ${a.zone}</div>
      <div class="detail-stars">${stars(a.note)}<span style="font-size:14px;font-weight:600;margin-left:4px">${a.note}/5</span><span style="font-size:12px;color:var(--text3);margin-left:4px">(${a.avis} avis)</span></div>
      <p style="margin-top:14px;font-size:14px;color:var(--text2);line-height:1.6">${a.desc}</p>
      <div class="card-tags" style="margin-top:12px">${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="section-label">Contact direct</div>
      <div class="contact-row">📞 <span>${a.tel}</span><button class="copy-btn" onclick="app.copy('${a.tel}')">⧉</button></div>
      <div class="contact-row">📍 <span>Cocody ${a.zone} · ${d.toFixed(1)} km de vous</span></div>
      <div class="contact-row">🕐 <span style="color:${a.dispo?'var(--green)':'var(--text3)'}">${a.dispo?'Disponible maintenant':'Actuellement occupé'}</span></div>
      <button class="btn-wa" onclick="app.whatsapp('${a.wa}','${a.nom}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
        Contacter sur WhatsApp
      </button>
      <button class="btn-call" onclick="app.call('${a.tel}')">📞 Appeler directement</button>
      <div class="section-label">Avis clients (${a.reviews.length})</div>
      ${a.reviews.map(r=>`
        <div class="review-card">
          <div class="review-top">
            <div class="review-av">${r.a[0]}</div>
            <span class="review-author">${r.a}</span>
            <span style="color:var(--amber)">${'★'.repeat(r.n)}</span>
            <span class="review-date">${r.d}</span>
          </div>
          <div class="review-text">${r.t}</div>
        </div>`).join('')}
      <div style="height:20px"></div>`;
    nav('viewDetail');
  }

  function call(tel){window.location.href='tel:'+tel.replace(/\s/g,'')}
  function whatsapp(num,nom){
    const msg=encodeURIComponent(`Bonjour ${nom}, j'ai trouvé votre profil sur ArtiZango. Je souhaite un devis.`);
    window.open(`https://wa.me/${num}?text=${msg}`,'_blank');
  }
  function copy(text){
    if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Numéro copié !'));
  }

  function showRegister(){nav('viewRegister')}
  function showAbout(){
    document.getElementById('detailBody').innerHTML=`
      <h2 style="font-size:20px;font-weight:600;margin-bottom:12px">ArtiZango</h2>
      <p style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:12px">La plateforme qui met en relation les habitants d'Abidjan avec des artisans qualifiés de leur quartier.</p>
      <p style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px">Géolocalisation en temps réel · Avis vérifiés · Contact WhatsApp direct</p>
      <div class="section-label">Vous êtes artisan ?</div>
      <p style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:12px">Inscrivez-vous gratuitement pour être visible dans votre quartier.</p>
      <button class="btn-green" style="width:100%" onclick="app.showRegister()">👤 Créer mon profil artisan</button>
      <div class="section-label">Contact</div>
      <div class="contact-row">✉️ <a href="mailto:contact@ArtiZango.ci" style="color:var(--blue)">contact@ArtiZango.ci</a></div>`;
    nav('viewDetail');
  }

  function submitRegister(e){
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target));
    const initials=d.nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const palettes=[['#E6F1FB','#0C447C'],['#FAEEDA','#633806'],['#E1F5EE','#085041'],['#FBEAF0','#72243E'],['#EAF3DE','#27500A']];
    const c=palettes[S.list.length%palettes.length];
    S.list.push({
      id:Date.now(),nom:d.nom,metier:d.metier,note:0,avis:0,
      lat:S.lat+(Math.random()-.5)*.008,lng:S.lng+(Math.random()-.5)*.008,
      dispo:true,exp:`${d.experience} an${d.experience>1?'s':''}`,
      av:initials,bg:c[0],cl:c[1],desc:d.description,
      tags:d.tags?d.tags.split(',').map(t=>t.trim()).filter(Boolean):[],
      tel:d.tel,wa:d.tel.replace(/[^0-9]/g,''),zone:d.zone,reviews:[]
    });
    e.target.reset();toast('Profil créé !');goBack();filter();
  }

  function nav(id){
    const cur=document.getElementById(S.view);
    const nxt=document.getElementById(id);
    cur.classList.add('slide-left');cur.classList.remove('active');
    nxt.classList.add('active');
    S.history.push(S.view);S.view=id;
  }
  function goBack(){
    if(!S.history.length)return;
    const prev=S.history.pop();
    document.getElementById(S.view).classList.remove('active');
    const p=document.getElementById(prev);
    p.classList.remove('slide-left');p.classList.add('active');
    S.view=prev;
  }
  function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  }

  return{init,filter,setRadius,toggleDispo,toggleTop,openDetail,call,whatsapp,copy,showRegister,showAbout,submitRegister,goBack,showListe,showCarte};
})();

document.addEventListener('DOMContentLoaded',app.init);
</script>
</body>
</html>
